<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>HBM Fleet Intelligence — one moment</title>
  <!-- Served by nginx for 502/503/504 while the app is busy: keep it self-contained (no assets from Node). -->
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    .card {
      width: 100%; max-width: 440px; text-align: center;
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 36px 28px; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }
    .brand { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8; margin-bottom: 20px; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 22px;
      border: 4px solid #334155; border-top-color: #38bdf8; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 21px; margin: 0 0 10px; color: #f8fafc; }
    p { font-size: 15px; line-height: 1.55; margin: 0 0 24px; color: #cbd5e1; }
    button {
      appearance: none; border: 0; border-radius: 10px; cursor: pointer;
      background: #0ea5e9; color: #fff; font-size: 15px; font-weight: 600;
      padding: 12px 26px;
    }
    button:hover { background: #0284c7; }
    .hint { margin-top: 16px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">HBM Fleet Intelligence</div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>The dashboard is busy updating data</h1>
    <p>This usually clears within a minute. Please refresh the page.</p>
    <button type="button" onclick="location.reload()">Refresh page</button>
    <div class="hint" id="hint">Retrying automatically in <span id="count">20</span>s…</div>
  </main>
  <script>
    (function () {
      var left = 20;
      var el = document.getElementById('count');
      var timer = setInterval(function () {
        left -= 1;
        if (el) el.textContent = String(left);
        if (left <= 0) {
          clearInterval(timer);
          location.reload();
        }
      }, 1000);
    })();
  </script>
</body>
</html>
