name: Deploy HBM Dashboard

# Secrets:
#   SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY
#   VITE_API_SECRET, VITE_ANTHROPIC_API_KEY  (build-time only)
#   OAUTH_GOOGLE_CLIENT_ID, OAUTH_GOOGLE_CLIENT_SECRET  (runtime, written to droplet .env)
# Runtime MIX_*/API_SECRET/PORT stay on droplet .env — never rebuild frontend there.
#
# Build dist on GitHub → SCP to droplet → git pull + pm2 restart.
# Do not Vite-build on the 1GB droplet.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          VITE_API_SECRET: ${{ secrets.VITE_API_SECRET }}
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: hbm-dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hbm-dist
          path: dist

      - name: Pull code and lean install
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e
            # Prefer new path; fall back if rename not done yet
            if [ -d /var/www/hbm-dashboard ]; then
              APP_DIR=/var/www/hbm-dashboard
            else
              APP_DIR=/var/www/larfarge-dashboard
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            if ! swapon --show | grep -q .; then
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile || true
            fi
            grep -q '^PORT=' .env && sed -i 's/^PORT=.*/PORT=3003/' .env || echo 'PORT=3003' >> .env
            npm ci --omit=dev --no-audit --no-fund
            # Native module can fail silently on lean install — force present for SQLite
            npm install better-sqlite3@^11.10.0 --omit=dev --no-audit --no-fund
            mkdir -p dist
            rm -rf dist/assets dist/index.html
            echo "APP_DIR=$APP_DIR"

      - name: Upload dist to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: /var/www/hbm-dashboard/dist
          overwrite: true
          strip_components: 1

      - name: Restart HBM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            APP_DIR=/var/www/hbm-dashboard
            [ -d "$APP_DIR" ] || APP_DIR=/var/www/larfarge-dashboard
            cd "$APP_DIR"
            # Drop legacy name
            pm2 delete larfarge-dashboard 2>/dev/null || true
            # Ensure production auth cookie flags exist (do not overwrite other .env keys)
            grep -q '^NODE_ENV=' .env || echo 'NODE_ENV=production' >> .env
            grep -q '^AUTH_COOKIE_SECURE=' .env || echo 'AUTH_COOKIE_SECURE=1' >> .env
            grep -q '^AUTH_MODE=' .env && sed -i 's/^AUTH_MODE=.*/AUTH_MODE=session/' .env || echo 'AUTH_MODE=session' >> .env
            grep -q '^APP_PUBLIC_URL=' .env && sed -i 's|^APP_PUBLIC_URL=.*|APP_PUBLIC_URL=https://hbm.bestpracticesltd.com.ng|' .env || echo 'APP_PUBLIC_URL=https://hbm.bestpracticesltd.com.ng' >> .env
            grep -q '^OAUTH_ALLOWED_DOMAINS=' .env && sed -i 's|^OAUTH_ALLOWED_DOMAINS=.*|OAUTH_ALLOWED_DOMAINS=bestpracticesltd.com,bestpracticesltd.com.ng,gmail.com|' .env || echo 'OAUTH_ALLOWED_DOMAINS=bestpracticesltd.com,bestpracticesltd.com.ng,gmail.com' >> .env
            if [ -n "${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}" ]; then
              grep -q '^OAUTH_GOOGLE_CLIENT_ID=' .env && sed -i 's|^OAUTH_GOOGLE_CLIENT_ID=.*|OAUTH_GOOGLE_CLIENT_ID=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}|' .env || echo 'OAUTH_GOOGLE_CLIENT_ID=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}' >> .env
            fi
            if [ -n "${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}" ]; then
              grep -q '^OAUTH_GOOGLE_CLIENT_SECRET=' .env && sed -i 's|^OAUTH_GOOGLE_CLIENT_SECRET=.*|OAUTH_GOOGLE_CLIENT_SECRET=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}|' .env || echo 'OAUTH_GOOGLE_CLIENT_SECRET=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}' >> .env
            fi
            if pm2 describe HBM-Dashboard >/dev/null 2>&1; then
              pm2 restart HBM-Dashboard --update-env
            else
              PORT=3003 NODE_ENV=production pm2 start server.js --name HBM-Dashboard --node-args='--max-old-space-size=768'
            fi
            sleep 8
            curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3003/ || true
            pm2 save
            pm2 list
