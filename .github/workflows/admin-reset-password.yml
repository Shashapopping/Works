name: Admin Reset User Password

on:
  workflow_dispatch:
    inputs:
      email:
        description: User email to reset
        required: true
        type: string

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset password on droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESET_EMAIL: ${{ inputs.email }}
          RESET_PASSWORD: ${{ secrets.HBM_TEMP_RESET_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: RESET_EMAIL,RESET_PASSWORD
          script: |
            set -e
            APP_DIR=/var/www/hbm-dashboard
            [ -d "$APP_DIR" ] || APP_DIR=/var/www/larfarge-dashboard
            cd "$APP_DIR"
            node --input-type=module <<'NODE'
            import { getDb } from './scripts/db.js';
            import { updateUser } from './scripts/auth.js';

            const email = String(process.env.RESET_EMAIL || '').trim().toLowerCase();
            const password = String(process.env.RESET_PASSWORD || '');
            if (!email || !email.includes('@')) throw new Error('Valid RESET_EMAIL is required');
            if (password.length < 8) throw new Error('RESET_PASSWORD is missing or too short');

            const db = getDb();
            const user = db.prepare('SELECT id, email FROM users WHERE lower(email) = ?').get(email);
            if (!user) throw new Error(`User not found: ${email}`);

            const updated = await updateUser(user.id, { status: 'active', password }, null);
            db.prepare('DELETE FROM sessions WHERE user_id = ?').run(user.id);

            console.log(JSON.stringify({
              ok: true,
              email: updated.email,
              status: updated.status,
              mustChangePassword: updated.mustChangePassword,
            }, null, 2));
            NODE
